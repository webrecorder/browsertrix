---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: {{ .Values.crawler_namespace }}
  name: crawler-run
rules:
# backend never reads pod specs or creates pods: crawler pods, PVCs and 
# ConfigMaps are applied by metacontroller, which has its own permissions
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

# Graceful shutdown uses exec into crawler pods (SIGTERM on resize/stop) and
# redis save containers (SIGUSR1/SIGUSR2) - see operator/crawls.py and
# operator/collindexes.py
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]

# Per-org storage secrets and per-crawl signing secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "patch", "delete"]

# Jobs and cronjobs the backend creates directly (background, index-import,
# replica, crawl schedules)
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "create", "update", "patch", "delete", "deletecollection"]

# ConfigMaps are only directly used by migrations, otherwise they're applied by 
# metacontroller.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["list", "patch", "deletecollection"]

# backend creates and tracks Crawl/profile/index resources; children are applied
# by metacontroller.
- apiGroups: ["btrix.cloud"]
  resources: ["crawljobs", "profilejobs", "collindexes"]
  verbs: ["get", "list", "create", "patch", "delete", "deletecollection"]

- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Release.Namespace }}
  name: bg-job
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "create", "update", "patch", "delete", "deletecollection"]

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: crawler-role
  namespace: {{ .Values.crawler_namespace }}
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ .Release.Namespace }}

roleRef:
  kind: Role
  name: crawler-run
  apiGroup: rbac.authorization.k8s.io

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: bg-job-role
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ .Release.Namespace }}

roleRef:
  kind: Role
  name: bg-job
  apiGroup: rbac.authorization.k8s.io
