
# mongo secrets used with backend and with local mongo, if any

---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-auth
  namespace: {{ .Values.crawler_namespace }}

type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "{{ .Values.mongo_auth.username }}"
  MONGO_INITDB_ROOT_PASSWORD: "{{ .Values.mongo_auth.password }}"
  MONGO_HOST: "{{ .Values.mongo_host }}"
  MONGO_DB_URL: "{{ .Values.mongo_auth.db_url }}"

---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-auth
  namespace: {{ .Release.Namespace }}

type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "{{ .Values.mongo_auth.username }}"
  MONGO_INITDB_ROOT_PASSWORD: "{{ .Values.mongo_auth.password }}"
  MONGO_HOST: "{{ .Values.mongo_host }}"
  MONGO_DB_URL: "{{ .Values.mongo_auth.db_url }}"


{{- if .Values.mongo_local }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: local-mongo
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: local-mongo
  serviceName: local-mongo
  replicas: {{ .Values.backend_num_replicas }}
  podManagementPolicy: Parallel
  volumeClaimTemplates:
    - metadata:
        name: data-db
        annotations:
          helm.sh/resource-policy: keep

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: "{{ .Values.mongo_storage }}"

        {{- if .Values.volume_storage_class }}
        storageClassName: {{ .Values.volume_storage_class }}
        {{- end }}

  template:
    metadata:
      labels:
        app: local-mongo

    spec:
      {{- if .Values.main_node_type }}
      nodeSelector:
        nodeType: {{ .Values.main_node_type }}
      {{- end }}

      containers:
        - name: mongo
          image: {{ .Values.mongo_image }}

          {{- if .Values.mongo_run_repair }}
          command:  ["mongod", "--repair"]
          {{- end }}

          imagePullPolicy: {{ .Values.mongo_pull_policy }}
          # needed for mongo 8 with latest kernels
          # (see: https://github.com/appwrite/appwrite/issues/12786)
          env:
          - name: GLIBC_TUNABLES
            value: "glibc.pthread.rseq=1"

          envFrom:
            - secretRef:
                name: mongo-auth

          volumeMounts:
            - name: data-db
              mountPath: /data/db
              subPath: mongo

          resources:
            limits:
              memory: {{ .Values.mongo_memory }}

            requests:
              cpu: {{ .Values.mongo_cpu }}
              memory: {{ .Values.mongo_memory }}

          # wait for startup, upto 120 x 5 seconds retries
          startupProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
                - --quiet

          # ensure db is ready
          readinessProbe:
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
                - --quiet

---
apiVersion: v1
kind: Service

metadata:
  namespace: {{ .Release.Namespace }}
  name: local-mongo
  labels:
    app: local-mongo

spec:
  #type: ClusterIP
  clusterIP: None
  selector:
    app: local-mongo

  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
      name: mongo

{{- end }}


