apiVersion: batch/v1
kind: Job
metadata:
  name: {{ id | tojson }}
  finalizers:
    - metacontroller.io/decoratorcontroller-background-job-operator
  labels:
    role: "background-job"
    job_type: {{ job_type | tojson }}

spec:
  ttlSecondsAfterFinished: 0
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      priorityClassName: bg-job
      containers:
      - name: rclone
        image: rclone/rclone:latest
        env:
        - name: RCLONE_CONFIG_PRIMARY_TYPE
          value: "s3"

        - name: RCLONE_CONFIG_PRIMARY_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ primary_secret_name | tojson }}
              key: STORE_ACCESS_KEY

        - name: RCLONE_CONFIG_PRIMARY_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ primary_secret_name | tojson }}
              key: STORE_SECRET_KEY

        - name: RCLONE_CONFIG_PRIMARY_REGION
          valueFrom:
            secretKeyRef:
              name: {{ primary_secret_name | tojson }}
              key: STORE_REGION

        - name: RCLONE_CONFIG_PRIMARY_PROVIDER
          valueFrom:
            secretKeyRef:
              name: {{ primary_secret_name | tojson }}
              key: STORE_S3_PROVIDER

        - name: RCLONE_CONFIG_PRIMARY_ENDPOINT
          value: {{ primary_endpoint | tojson }}

        - name: RCLONE_CONFIG_REPLICA_TYPE
          value: "s3"

        - name: RCLONE_CONFIG_REPLICA_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ replica_secret_name | tojson }}
              key: STORE_ACCESS_KEY

        - name: RCLONE_CONFIG_REPLICA_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ replica_secret_name | tojson }}
              key: STORE_SECRET_KEY

        - name: RCLONE_CONFIG_REPLICA_REGION
          valueFrom:
            secretKeyRef:
              name: {{ replica_secret_name | tojson }}
              key: STORE_REGION

        - name: RCLONE_CONFIG_REPLICA_PROVIDER
          valueFrom:
            secretKeyRef:
              name: {{ replica_secret_name | tojson }}
              key: STORE_S3_PROVIDER

        - name: RCLONE_CONFIG_REPLICA_ENDPOINT
          value: {{ replica_endpoint | tojson }}

        command: ["rclone", "-vv", "copy", "--checksum", {{ ("primary:" ~ primary_file_path) | tojson }}, {{ ("replica:" ~ replica_file_path) | tojson }}]

        resources:
          limits:
            memory: "1200Mi"

          requests:
            memory: "500Mi"
            cpu: "200m"
