---
apiVersion: v1
kind: Pod
metadata:
  name: {{ ("browser-" ~ id) | tojson }}
  namespace: {{ namespace | tojson }}
  labels:
    browser: {{ id | tojson }}
    role: browser
    network-policy: limit-crawler-egress

spec:
  # Browser profiles render untrusted sites and never call the Kubernetes API.
  automountServiceAccountToken: false
  hostname: {{ ("browser-" ~ id) | tojson }}
  subdomain: browser

  securityContext:
    runAsNonRoot: true
    runAsUser: {{ crawler_uid | int }}
    runAsGroup: {{ crawler_gid | int }}
    fsGroup: {{ crawler_fsgroup | int }}

  volumes:
    - name: tmpdir
      emptyDir:
        sizeLimit: {{ profile_browser_workdir_size }}

    {% if proxy_id %}
    - name: proxies
      secret:
        secretName: proxies
        defaultMode: 0600
    - name: force-user-and-group-name
      secret:
        secretName: force-user-and-group-name
        defaultMode: 0600
    {% endif %}

  {% if priorityClassName %}
  priorityClassName: {{ priorityClassName | tojson }}
  {% endif %}

  restartPolicy: OnFailure

{% if crawler_node_type %}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: nodeType
              operator: In
              values:
                - {{ crawler_node_type | tojson }}
{% endif %}

  tolerations:
    - key: nodeType
      operator: Equal
      value: crawling
      effect: NoSchedule
    - key: node.kubernetes.io/not-ready
      operator: Exists
      tolerationSeconds: 300
      effect: NoExecute
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300

  containers:
    - name: browser
      image: {{ crawler_image | tojson }}
      imagePullPolicy: {{ crawler_image_pull_policy | tojson }}
      command:
        - create-login-profile
        - --interactive
        - --filename
        - /tmp/profile.tar.gz
        - --url
        - {{ url | tojson }}
      {%- if profile_filename %}
        - --profile
        - {{ ("@" ~ profile_filename) | tojson }}
      {%- endif %}
      {% if proxy_id %}
        - --proxyServer
        - {{ proxy_url | tojson }}
      {% if proxy_ssh_private_key %}
        - --sshProxyPrivateKeyFile
        - /tmp/ssh-proxy/private-key
      {% endif %}
      {% if proxy_ssh_host_public_key %}
        - --sshProxyKnownHostsFile
        - /tmp/ssh-proxy/known-hosts
      {% endif %}
      {% endif %}

      volumeMounts:
        - name: tmpdir
          mountPath: /tmp
      {% if proxy_id %}
      {% if proxy_ssh_private_key %}
        - name: proxies
          mountPath: /tmp/ssh-proxy/private-key
          subPath: {{ (proxy_id ~ "-private-key") | tojson }}
          readOnly: true
      {% endif %}
      {% if proxy_ssh_host_public_key %}
        - name: proxies
          mountPath: /tmp/ssh-proxy/known-hosts
          subPath: {{ (proxy_id ~ "-known-hosts") | tojson }}
          readOnly: true
      {% endif %}
        - name: force-user-and-group-name
          mountPath: /etc/passwd
          subPath: passwd
          readOnly: true
        - name: force-user-and-group-name
          mountPath: /etc/group
          subPath: group
          readOnly: true
       {% endif %}

      envFrom:
        - secretRef:
            name: {{ storage_secret | tojson }}

      env:
        - name: HOME
          value: /tmp/home

        - name: STORE_PATH
          value: {{ storage_path | tojson }}

        - name: VNC_PASS
          value: {{ vnc_password | tojson }}

      {% if crawler_socks_proxy_host %}
        - name: CHROME_FLAGS
          value: {{ ("--proxy-server=socks5://" ~ crawler_socks_proxy_host ~ ":" ~ (crawler_socks_proxy_port | default("9050"))) | tojson }}
      {% endif %}

      resources:
        limits:
          memory: "{{ memory_limit | safe }}"

        requests:
          cpu: "{{ profile_cpu | safe }}"
          memory: "{{ profile_memory | safe }}"

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
