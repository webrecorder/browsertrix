apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ id | tojson }}
  labels:
    btrix.crawlconfig: {{ cid | tojson }}
    btrix.org: {{ oid | tojson }}
{% if userid %}
    btrix.userid: {{ userid | tojson }}
{% endif %}
    role: "cron-job"

spec:
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 2

  schedule: {{ schedule | tojson }}

  jobTemplate:
    metadata:
      labels:
        btrix.crawlconfig: {{ cid | tojson }}
        role: "scheduled-crawljob"

    spec:
      suspend: true
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: noop
              image: "docker.io/tianon/true:multiarch"
              imagePullPolicy: IfNotPresent
