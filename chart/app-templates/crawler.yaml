{% if not no_pvc %}
# -------
# PVC
# -------

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ name | tojson }}
  namespace: {{ namespace | tojson }}
  labels:
    crawl: {{ id | tojson }}
    role: crawler

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: {{ storage }}

  {% if volume_storage_class %}
  storageClassName: {{ volume_storage_class }}
  {% endif %}

{% endif %}

# -------
# CRAWLER
# -------
{% if init_crawler %}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ name | tojson }}
  namespace: {{ namespace | tojson }}
  labels:
    crawl: {{ id | tojson }}
    role: crawler
    network-policy: limit-crawler-egress

spec:
  # The crawler processes untrusted web content and never calls the Kubernetes
  # API; do not give it a service-account token.
  automountServiceAccountToken: false
  hostname: {{ name | tojson }}
  subdomain: crawler

  {% if priorityClassName %}
  priorityClassName: {{ priorityClassName | tojson }}
  {% endif %}

  restartPolicy: OnFailure

  securityContext:
    runAsNonRoot: true
    runAsUser: {{ crawler_uid | int }}
    runAsGroup: {{ crawler_gid | int }}
    fsGroup: {{ crawler_fsgroup | int }}

  terminationGracePeriodSeconds: {{ termination_grace_secs }}
  volumes:
    - name: crawl-config
      configMap:
        name: {{ ("crawl-config-" ~ id) | tojson }}
    {% if qa_source_crawl_id %}
    - name: qa-config
      configMap:
        name: {{ ("qa-replay-" ~ qa_source_crawl_id) | tojson }}
    {% endif %}
    - name: crawl-data
    {% if not no_pvc %}
      persistentVolumeClaim:
        claimName: {{ name | tojson }}
    {% else %}
      emptyDir: {}
    {% endif %}
    - name: tmpdir
      emptyDir: {}
    {% if add_proxies %}
    - name: proxies
      secret:
        secretName: proxies
        defaultMode: 0600
    - name: force-user-and-group-name
      secret:
        secretName: force-user-and-group-name
        defaultMode: 0600
    {% endif %}

  affinity:
{% if crawler_node_type %}
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: nodeType
              operator: In
              values:
                - {{ crawler_node_type | tojson }}
{% endif %}

    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 10
          podAffinityTerm:
            topologyKey: "kubernetes.io/hostname"
            labelSelector:
              matchExpressions:
              - key: crawl
                operator: In
                values:
                - {{ id | tojson }}

  tolerations:
    - key: nodeType
      operator: Equal
      value: crawling
      effect: NoSchedule
    - key: node.kubernetes.io/not-ready
      operator: Exists
      tolerationSeconds: 300
      effect: NoExecute
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300

  containers:
    - name: crawler
      image: {{ crawler_image | tojson }}
      imagePullPolicy: {{ crawler_image_pull_policy | tojson }}
      command:
        - {{ "crawl" if not qa_source_crawl_id else "qa" }}
        - --config
        - /tmp/config/crawl-config.json
        - --workers
        - "{{ workers }}"
        - --redisStoreUrl
        - {{ redis_url | tojson }}
      {% if qa_source_crawl_id %}
        - --qaSource
        - /tmp/qa/qa-config.json
      {% else %}
      {% if redis_dedupe_url %}
        - --redisDedupeUrl
        - {{ redis_dedupe_url | tojson }}
      {% endif %}
      {% if profile_filename %}
        - --profile
        - {{ ("@" ~ profile_filename) | tojson }}
      {% endif %}
      {% if profile_filename and save_profile %}
        - --saveProfile
      {% endif %}
      {% endif %}
      {% if add_proxies %}
      {% if proxy_url %}
        - --proxyServer
        - {{ proxy_url | tojson }}
      {% endif %}
      {% if proxy_id and proxy_ssh_private_key %}
        - --sshProxyPrivateKeyFile
        - {{ ("/tmp/proxies/" ~ proxy_id ~ "-private-key") | tojson }}
      {% endif %}
      {% if proxy_id and proxy_ssh_host_public_key %}
        - --sshProxyKnownHostsFile
        - {{ ("/tmp/proxies/" ~ proxy_id ~ "-known-hosts") | tojson }}
      {% endif %}
        - --proxyServerConfig
        - /tmp/proxies/host-proxies.json
      {% endif %}
      volumeMounts:
        - name: crawl-config
          mountPath: /tmp/config/
          readOnly: True

      {% if qa_source_crawl_id %}
        - name: qa-config
          mountPath: /tmp/qa/
          readOnly: True
      {% endif %}
      {% if add_proxies %}
        - name: proxies
          mountPath: /tmp/proxies/
          readOnly: true
        - name: force-user-and-group-name
          mountPath: /etc/passwd
          subPath: passwd
          readOnly: true
        - name: force-user-and-group-name
          mountPath: /etc/group
          subPath: group
          readOnly: true
      {% endif %}
        - name: crawl-data
          mountPath: /crawls

        - name: tmpdir
          mountPath: /tmp

      envFrom:
        - configMapRef:
            name: shared-crawler-config

        - secretRef:
            name: {{ storage_secret | tojson }}

      {% if signing_secret %}
        - secretRef:
            name: {{ signing_secret | tojson }}
      {% endif %}

      env:
        - name: HOME
          value: /crawls/home

        - name: CRAWL_ID
          value: {{ id | tojson }}

        - name: WEBHOOK_URL
          value: {{ (redis_url ~ "/crawls-done") | tojson }}

        - name: STORE_PATH
          value: {{ storage_path | tojson }}

        - name: STORE_FILENAME
          value: {{ storage_filename | tojson }}

        - name: STORE_USER
          value: {{ userid | tojson }}

        - name: WARC_PREFIX
          value: {{ warc_prefix | tojson }}

      resources:
        limits:
          memory: "{{ memory_limit | safe }}"

        requests:
          cpu: "{{ cpu | safe }}"
          memory: "{{ memory | safe }}"

      {% if crawler_liveness_port and crawler_liveness_port != '0' %}
      livenessProbe:
        httpGet:
          path: /healthz
          port: {{ crawler_liveness_port | int }}

        initialDelaySeconds: 15
        periodSeconds: 120
        failureThreshold: 3
      {% endif %}

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true

{% endif %}
