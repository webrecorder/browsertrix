# -------
# CONFIGMAP
# -------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ name | tojson }}
  namespace: {{ namespace | tojson }}
  labels:
    crawl: {{ id | tojson }}
    role: crawler
    oid: {{ oid | tojson }}
    cid: {{ cid | tojson }}

data:
  crawl-config.json: {{ config | tojson }}
