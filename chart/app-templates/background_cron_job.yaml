apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ id }}"
  labels:
    role: "cron-background-job"
    job_type: {{ job_type }}

spec:
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 2

  schedule: "{{ schedule }}"

  jobTemplate:
    metadata:
      finalizers:
        - metacontroller.io/decoratorcontroller-background-job-operator
      labels:
        role: "background-job"
        job_type: {{ job_type }}
        job_id: {{ id }}

    spec:
      template:
        spec:
          # For trusted backend code that only talks to the Kubernetes API, 
          # mount a root-only token instead of the world-readable auto-injected 
          # one.
          automountServiceAccountToken: false
          restartPolicy: Never
          priorityClassName: bg-job
          podFailurePolicy:
            rules:
            - action: FailJob
              onExitCodes:
                containerName: btrixbgjob
                operator: NotIn
                values: [0]

          volumes:
            - name: ops-configs
              secret:
                secretName: ops-configs
                defaultMode: 0400

            - name: app-templates
              configMap:
                name: app-templates

            - name: kube-api-access
              projected:
                defaultMode: 0400
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3607
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - downwardAPI:
                      items:
                        - path: namespace
                          fieldRef:
                            apiVersion: v1
                            fieldPath: metadata.namespace

            - name: tmp
              emptyDir: {}

          containers:
            - name: btrixbgjob
              image: {{ backend_image }}
              imagePullPolicy: {{ pull_policy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
              - name: BG_JOB_TYPE
                value: {{ job_type }}

              envFrom:
                - configMapRef:
                    name: backend-env-config
                - secretRef:
                    name: mongo-auth

              volumeMounts:
                - name: kube-api-access
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true

                - name: tmp
                  mountPath: /tmp

                - name: ops-configs
                  mountPath: /ops-configs/

                - name: app-templates
                  mountPath: /app/btrixcloud/templates/

              command: ["python3", "-m", "btrixcloud.main_bg"]

              resources:
{% if larger_resources %}
                limits:
                  memory: "1200Mi"

                requests:
                  memory: "500Mi"
                  cpu: "200m"
{% else %}
                limits:
                  memory: "200Mi"

                requests:
                  memory: "200Mi"
                  cpu: "50m"
{% endif %}
