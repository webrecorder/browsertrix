apiVersion: btrix.cloud/v1
kind: CollIndex
metadata:
  name: collindex-{{ id }}
  finalizers:
    - metacontroller.io/compositecontroller-collindexes-operator
  labels:
    role: "collindex"
    oid: {{ oid }}
    coll: {{ id }}

spec:
  selector:
    matchLabels:
      coll: "{{ id }}"

  id: "{{ id }}"
  oid: "{{ oid }}"
