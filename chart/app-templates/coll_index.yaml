apiVersion: btrix.cloud/v1
kind: CollIndex
metadata:
  name: {{ ("collindex-" ~ id) | tojson }}
  finalizers:
    - metacontroller.io/compositecontroller-collindexes-operator
  labels:
    role: "collindex"
    oid: {{ oid | tojson }}
    coll: {{ id | tojson }}

spec:
  selector:
    matchLabels:
      coll: {{ id | tojson }}

  id: {{ id | tojson }}
  oid: {{ oid | tojson }}
