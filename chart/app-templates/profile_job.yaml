apiVersion: btrix.cloud/v1
kind: ProfileJob
metadata:
  name: {{ ("profilejob-" ~ id) | tojson }}
  labels:
    browser: {{ id | tojson }}
    role: "job"
    btrix.org: {{ oid | tojson }}
    btrix.user: {{ userid | tojson }}
    {%- if base_profile %}
    btrix.baseprofile: {{ base_profile | tojson }}
    {%- endif %}
    btrix.storage: {{ storage_name | tojson }}
    profileid: {{ profileid | tojson }}
    proxyid: {{ proxy_id | tojson }}
    crawlerChannel: {{ crawler_channel | tojson }}

spec:
  selector:
    matchLabels:
      browser: {{ id | tojson }}

  id: {{ id | tojson }}
  userid: {{ userid | tojson }}
  oid: {{ oid | tojson }}

  storageName: {{ storage_name | tojson }}
  crawlerImage: {{ crawler_image | tojson }}
  imagePullPolicy: {{ image_pull_policy | tojson }}

  startUrl: {{ url | tojson }}
  profileFilename: {{ profile_filename | tojson }}
  vncPassword: {{ vnc_password | tojson }}

  proxyId: {{ proxy_id | tojson }}

  {% if expire_time %}
  expireTime: {{ expire_time | tojson }}
  {% endif %}
