apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ id }}"
  finalizers:
    - metacontroller.io/decoratorcontroller-background-job-operator
  labels:
    role: "background-job"
    job_type: "{{ job_type }}"
{% if oid %}
    btrix.org: "{{ oid }}"
{% endif %}
{% if collection_id %}
    btrix.collid: "{{ collection_id }}"
{% endif %}

spec:
  ttlSecondsAfterFinished: 0
  backoffLimit: 6
  {% if scale %}
  parallelism: {{ scale }}
  {% endif %}
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes:
        containerName: btrixbgjob
        operator: In
        values: [2]
  template:
    spec:
      # For trusted backend code that only talks to the Kubernetes API, mount a
      # root-only token instead of the world-readable auto-injected one.
      automountServiceAccountToken: false
      restartPolicy: Never
      priorityClassName: bg-job
      
      volumes:
        - name: ops-configs
          secret:
            secretName: ops-configs
            defaultMode: 0400

        - name: app-templates
          configMap:
            name: app-templates

        - name: kube-api-access
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace

        - name: tmp
          emptyDir: {}

      containers:
        - name: btrixbgjob
          image: "{{ backend_image }}"
          imagePullPolicy: "{{ pull_policy }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
          - name: BG_JOB_TYPE
            value: {{ job_type }}

{% if oid %}
          - name: OID
            value: "{{ oid }}"
{% endif %}
          - name: CRAWL_TYPE
            value: "{{ crawl_type }}"

{% if crawl_id %}
          - name: CRAWL_ID
            value: {{ crawl_id | tojson }}
{% endif %}

{% if collection_id %}
          - name: COLLECTION_ID
            value: "{{ collection_id }}"
{% endif %}

          envFrom:
            - configMapRef:
                name: backend-env-config
            - secretRef:
                name: mongo-auth

          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true

            - name: tmp
              mountPath: /tmp

            - name: ops-configs
              mountPath: /ops-configs/

            - name: app-templates
              mountPath: /app/btrixcloud/templates/

          command: ["python3", "-m", "btrixcloud.main_bg"]

          resources:
{% if larger_resources %}
            limits:
              memory: "1200Mi"

            requests:
              memory: "500Mi"
              cpu: "200m"
{% else %}
            limits:
              memory: "200Mi"

            requests:
              memory: "200Mi"
              cpu: "50m"
{% endif %}
