apiVersion: batch/v1
kind: Job
metadata:
  name: {{ id | tojson }}
  finalizers:
    - metacontroller.io/decoratorcontroller-background-job-operator
  labels:
    role: "background-job"
    job_type: {{ job_type | tojson }}
{% if oid %}
    btrix.org: {{ oid | tojson }}
{% endif %}
{% if collection_id %}
    btrix.collid: {{ collection_id | tojson }}
{% endif %}

spec:
  ttlSecondsAfterFinished: 0
  backoffLimit: 6
  {% if scale %}
  parallelism: {{ scale }}
  {% endif %}
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes:
        containerName: btrixbgjob
        operator: In
        values: [2]
  template:
    spec:
      restartPolicy: Never
      priorityClassName: bg-job

      volumes:
        - name: ops-configs
          secret:
            secretName: ops-configs

        - name: app-templates
          configMap:
            name: app-templates

      containers:
        - name: btrixbgjob
          image: {{ backend_image | tojson }}
          imagePullPolicy: {{ pull_policy | tojson }}
          env:
          - name: BG_JOB_TYPE
            value: {{ job_type | tojson }}

{% if oid %}
          - name: OID
            value: {{ oid | tojson }}
{% endif %}
          - name: CRAWL_TYPE
            value: {{ (crawl_type or "") | tojson }}

{% if crawl_id %}
          - name: CRAWL_ID
            value: {{ crawl_id | tojson }}
{% endif %}

{% if collection_id %}
          - name: COLLECTION_ID
            value: {{ collection_id | tojson }}
{% endif %}

          envFrom:
            - configMapRef:
                name: backend-env-config
            - secretRef:
                name: mongo-auth

          volumeMounts:
            - name: ops-configs
              mountPath: /ops-configs/

            - name: app-templates
              mountPath: /app/btrixcloud/templates/

          command: ["python3", "-m", "btrixcloud.main_bg"]

          resources:
{% if larger_resources %}
            limits:
              memory: "1200Mi"

            requests:
              memory: "500Mi"
              cpu: "200m"
{% else %}
            limits:
              memory: "200Mi"

            requests:
              memory: "200Mi"
              cpu: "50m"
{% endif %}
