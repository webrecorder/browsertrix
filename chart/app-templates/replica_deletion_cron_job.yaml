apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ id | tojson }}
  labels:
    role: "cron-background-job"
    job_type: {{ job_type | tojson }}
    btrix.org: {{ oid | tojson }}

spec:
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 2

  schedule: {{ schedule | tojson }}

  jobTemplate:
    metadata:
      finalizers:
        - metacontroller.io/decoratorcontroller-background-job-operator
      labels:
        role: "background-job"
        job_type: {{ job_type | tojson }}
        job_id: {{ id | tojson }}
        btrix.org: {{ oid | tojson }}

    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          priorityClassName: bg-job
          podFailurePolicy:
            rules:
            - action: FailJob
              onExitCodes:
                containerName: rclone
                operator: NotIn
                values: [0]

          containers:
            - name: rclone
              image: rclone/rclone:latest
              env:

              - name: RCLONE_CONFIG_REPLICA_TYPE
                value: "s3"

              - name: RCLONE_CONFIG_REPLICA_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: {{ replica_secret_name | tojson }}
                    key: STORE_ACCESS_KEY

              - name: RCLONE_CONFIG_REPLICA_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: {{ replica_secret_name | tojson }}
                    key: STORE_SECRET_KEY

              - name: RCLONE_CONFIG_REPLICA_REGION
                valueFrom:
                  secretKeyRef:
                    name: {{ replica_secret_name | tojson }}
                    key: STORE_REGION

              - name: RCLONE_CONFIG_REPLICA_PROVIDER
                valueFrom:
                  secretKeyRef:
                    name: {{ replica_secret_name | tojson }}
                    key: STORE_S3_PROVIDER

              - name: RCLONE_CONFIG_REPLICA_ENDPOINT
                value: {{ replica_endpoint | tojson }}

              command: ["rclone", "-vv", "delete", {{ ("replica:" ~ replica_file_path) | tojson }}]

              resources:
                limits:
                  memory: "200Mi"

                requests:
                  memory: "200Mi"
                  cpu: "50m"
