site_name: Browsertrix Docs
repo_url: https://github.com/webrecorder/browsertrix-cloud/
repo_name: Browsertrix
edit_uri: edit/main/frontend/docs/docs/
site_url: !ENV [DOCS_URL, "/"] # Relative path should be replaced with correct URL in nginx script
extra_css:
  - stylesheets/theme-light.css
  - stylesheets/theme-dark.css
  - stylesheets/extra.css
extra_javascript:
  - js/links.js
  - js/insertversion.js
  - js/search.js
theme:
  name: material
  variant: classic
  custom_dir: docs/overrides
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.footer
    - navigation.prune
    - content.code.copy
    - content.tooltips
    - content.tabs.link
  logo: assets/brand/browsertrix-icon-color.png
  favicon: assets/brand/favicon.svg

  icon:
    admonition:
      note: bootstrap/pencil-fill
      abstract: bootstrap/file-earmark-text-fill
      info: bootstrap/info-circle-fill
      tip: bootstrap/lightbulb-fill
      success: bootstrap/check-circle-fill
      question: bootstrap/question-circle-fill
      warning: bootstrap/exclamation-diamond-fill
      failure: bootstrap/x-octagon-fill
      danger: bootstrap/exclamation-diamond-fill
      bug: bootstrap/bug-fill
      example: bootstrap/mortarboard-fill
      quote: bootstrap/quote

    repo: bootstrap/github
    edit: bootstrap/pencil
    view: bootstrap/eye

markdown_extensions:
  - toc:
      title: On This Page
      toc_depth: 3
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - docs/overrides/.icons
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.blocks.caption
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - def_list
  - attr_list
  - md_in_html

extra:
  generator: false
  social:
    - icon: bootstrap/globe
      link: https://webrecorder.net
    - icon: bootstrap/chat-left-text-fill
      link: https://forum.webrecorder.net/
    - icon: bootstrap/mastodon
      link: https://digipres.club/@webrecorder
    - icon: bootstrap/youtube
      link: https://www.youtube.com/@webrecorder
  analytics:
    provider: plausible
  enable_analytics: !ENV ENABLE_ANALYTICS
copyright: "Creative Commons Attribution 4.0 International (CC BY 4.0)"

plugins:
  - tags:
      tags_allowed:
        - Social Media
  - redirects:
      redirect_maps:
        "user-guide/collections.md": "user-guide/collection.md"
        "user-guide/browser-profiles.md": "user-guide/browser-profiles/browser-profiles-overview.md"
