# Configuration for Browsertrix embed
INHERIT: ./config/mkdocs.base.yml

site_url: /
site_dir: site-embed

extra_css:
  - stylesheets/browsertrix.css
extra_javascript:
  - js/embed.js

theme:
  palette:
    scheme: webrecorder-light

nav:
  - user-guide/index.md
  - Getting Started:
      - user-guide/signup.md
      - user-guide/navigation.md
      - user-guide/getting-started.md
      - user-guide/concepts.md
  - Orgs:
      - user-guide/org.md
      - user-guide/overview.md
      - user-guide/join.md
  - Crawling:
      - user-guide/crawl-workflows.md
      - user-guide/workflow-setup.md
      - user-guide/running-crawl.md
      - user-guide/behaviors.md
  - Archived Items:
      - user-guide/archived-items.md
      - user-guide/review.md
  - Collections:
      - user-guide/collection.md
      - user-guide/presentation-sharing.md
      - user-guide/public-collections-gallery.md
  - Deduplication:
      - user-guide/deduplication.md
  - Quality Assurance:
      - user-guide/quality-assurance.md
      - user-guide/qa-review.md
  - Browser Profiles:
      - user-guide/browser-profiles/browser-profiles-overview.md
      - user-guide/browser-profiles/create-browser-profile.md
      - user-guide/browser-profiles/configure-sites.md
      - user-guide/browser-profiles/usage-in-crawls.md
      - user-guide/browser-profiles/edit-browser-profile.md
  - Org Settings:
      - user-guide/org-settings.md
      - user-guide/org-members.md
  - Account Settings:
      - user-guide/user-settings.md
      - user-guide/change-password.md

plugins:
  - meta:
      meta_file: .meta.user-guide.yml
