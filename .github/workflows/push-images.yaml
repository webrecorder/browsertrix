name: "*** Push Branch to Repo ***"

on:
  workflow_dispatch:
    inputs:
      repo_tag:
        description: "Tag to push to"
        required: true
        type: string
        default: "latest"

jobs:
  push_images:
    name: Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, emails, frontend]
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DO_REGISTRY }}
          username: ${{ secrets.DO_API_TOKEN }}
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Set Env Vars
        run: |
          echo VERSION=`cat version.txt` >> $GITHUB_ENV
          echo GIT_COMMIT_HASH=`git rev-parse --short HEAD` >> $GITHUB_ENV
          echo GIT_BRANCH_NAME=`git rev-parse --abbrev-ref HEAD` >> $GITHUB_ENV

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            GIT_COMMIT_HASH=${{ env.GIT_COMMIT_HASH }}
            GIT_BRANCH_NAME=${{ env.GIT_BRANCH_NAME }}
          tags: ${{ secrets.DO_REGISTRY_PATH }}/webrecorder/browsertrix-${{ matrix.image }}:${{ inputs.repo_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
